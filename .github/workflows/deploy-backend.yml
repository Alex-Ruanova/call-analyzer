name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker/api.Dockerfile'
      - 'docker/worker.Dockerfile'
      - 'docker-compose.prod.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/altur-api:${{ github.sha }},${{ secrets.ACR_LOGIN_SERVER }}/altur-api:latest
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/altur-api:cache
          cache-to: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/altur-api:cache,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/worker.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/altur-worker:${{ github.sha }},${{ secrets.ACR_LOGIN_SERVER }}/altur-worker:latest
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/altur-worker:cache
          cache-to: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/altur-worker:cache,mode=max

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /app
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin
            IMAGE_TAG=latest ACR_LOGIN_SERVER=${{ secrets.ACR_LOGIN_SERVER }} POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
              docker compose -f docker-compose.prod.yml pull api worker
            IMAGE_TAG=latest ACR_LOGIN_SERVER=${{ secrets.ACR_LOGIN_SERVER }} POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
              docker compose -f docker-compose.prod.yml up -d api worker
