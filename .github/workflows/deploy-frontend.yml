name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docker-compose.prod.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/altur-frontend:${{ github.sha }},${{ secrets.ACR_LOGIN_SERVER }}/altur-frontend:latest
          build-args: |
            VITE_API_BASE_URL=https://altur.norvaru.com
          cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/altur-frontend:cache
          cache-to: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/altur-frontend:cache,mode=max

      - name: Copy docker-compose.prod.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /app/

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /app
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin
            IMAGE_TAG=latest ACR_LOGIN_SERVER=${{ secrets.ACR_LOGIN_SERVER }} POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
              docker compose -f docker-compose.prod.yml pull frontend
            IMAGE_TAG=latest ACR_LOGIN_SERVER=${{ secrets.ACR_LOGIN_SERVER }} POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
              docker compose -f docker-compose.prod.yml up -d frontend
